<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1800px;
    height: 1150px;
    background: #14171f;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
  <defs>
    <!-- Subtle schematic grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2430" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2738"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="batGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d5dbe6"/>
      <stop offset="50%" stop-color="#b4becf"/>
      <stop offset="100%" stop-color="#8e99ad"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1800" height="1150" fill="#131720"/>
  <rect width="1800" height="1150" fill="url(#grid)"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="1740" height="76" rx="14" fill="#1c2230" stroke="#2f3a4f" stroke-width="2"/>
  <text x="56" y="57" fill="#38bdf8" font-size="28" font-weight="800" letter-spacing="0.5">📺 MINI RETRO TV — DOĞRULANMIŞ GÖRSEL DEVRE &amp; KABLO ŞEMASI</text>
  <text x="56" y="83" fill="#94a3b8" font-size="16" font-weight="500">ESP32-S3 Mini  •  1.3" 240×240 ST7789 IPS (FSPI)  •  16GB MicroSD (HSPI)  •  MAX98357A I2S Amfi + Hoparlör  •  TP4056 + 5V Boost Modülü</text>
  <rect x="1450" y="38" width="295" height="44" rx="10" fill="#291d1c" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1597" y="65" fill="#fca5a5" font-size="14" font-weight="700" text-anchor="middle">⚠️ EKRAN = 3.3V  |  SD &amp; AMFİ = 5V</text>

  <!-- ==================== WIRE LAYER ==================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. BATTERY -> BOOST CHARGER -->
    <path d="M 270 220 L 340 220" stroke="#ef4444" stroke-width="5"/> <!-- BAT+ -->
    <path d="M 270 270 L 340 270" stroke="#64748b" stroke-width="5"/> <!-- BAT- -->

    <!-- 2. BOOST 5V OUT -> ESP32 5V & SD VCC & MAX98357A VIN -->
    <!-- Boost VOUT+ (610, 215) -> ESP32 Right 5V (1010, 310) -->
    <path d="M 610 215 L 670 215 L 670 155 L 1110 155 L 1110 310 L 1010 310" stroke="#ef4444" stroke-width="4.5"/>
    <!-- Branch to MAX98357A VIN (1220, 745) -->
    <path d="M 1110 310 L 1110 745 L 1220 745" stroke="#ef4444" stroke-width="4.5"/>
    <circle cx="1110" cy="310" r="6" fill="#ef4444"/>
    <!-- Branch to MicroSD VCC (420, 755) via 5V rail -->
    <path d="M 670 215 L 670 755 L 420 755" stroke="#ef4444" stroke-width="4.5"/>
    <circle cx="670" cy="215" r="6" fill="#ef4444"/>

    <!-- 3. COMMON GND RAIL -->
    <!-- Boost VOUT- (610, 275) -> ESP32 Right GND (1010, 355) -->
    <path d="M 610 275 L 640 275 L 640 175 L 1085 175 L 1085 355 L 1010 355" stroke="#94a3b8" stroke-width="4.5"/>
    <!-- GND to Screen GND (1250, 215) -->
    <path d="M 1085 215 L 1250 215" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="1085" cy="215" r="5.5" fill="#94a3b8"/>
    <!-- GND to MAX98357A GND (1220, 790) -->
    <path d="M 1085 355 L 1085 790 L 1220 790" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="1085" cy="355" r="6" fill="#94a3b8"/>
    <!-- GND to MicroSD GND (420, 710) -->
    <path d="M 640 275 L 640 710 L 420 710" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="640" cy="275" r="5.5" fill="#94a3b8"/>

    <!-- 4. EKRAN 3.3V (ESP32 Sol 3V3 -> Screen VCC) -->
    <path d="M 790 310 L 710 310 L 710 135 L 1140 135 L 1140 260 L 1250 260" stroke="#f97316" stroke-width="4"/>

    <!-- 5. EKRAN SPI HATLARI (FSPI: Sol Sıra Pinleri) -->
    <!-- SCL: ESP32 GPIO 4 (790, 490) -> Screen SCL (1250, 305) -->
    <path d="M 790 490 L 730 490 L 730 195 L 1160 195 L 1160 305 L 1250 305" stroke="#eab308" stroke-width="4"/>

    <!-- SDA (MOSI): ESP32 GPIO 6 (790, 580) -> Screen SDA (1250, 350) -->
    <path d="M 790 580 L 750 580 L 750 225 L 1180 225 L 1180 350 L 1250 350" stroke="#3b82f6" stroke-width="4"/>

    <!-- RES: ESP32 GPIO 2 (790, 400) -> Screen RES (1250, 395) -->
    <path d="M 790 400 L 720 400 L 720 395 L 1250 395" stroke="#22c55e" stroke-width="4"/>

    <!-- DC: ESP32 GPIO 3 (790, 445) -> Screen DC (1250, 440) -->
    <path d="M 790 445 L 740 445 L 740 440 L 1250 440" stroke="#a855f7" stroke-width="4"/>

    <!-- BLK: ESP32 GPIO 1 (790, 355) -> Screen BLK (1250, 485) -->
    <path d="M 790 355 L 690 355 L 690 485 L 1250 485" stroke="#fde047" stroke-width="4"/>

    <!-- 6. 16GB MICROSD HATLARI (HSPI: Sağ Sıra Pinleri) -->
    <!-- CS: ESP32 GPIO 10 (1010, 400) -> MicroSD CS (420, 935) -->
    <path d="M 1010 400 L 1040 400 L 1040 655 L 590 655 L 590 935 L 420 935" stroke="#f59e0b" stroke-width="4"/>

    <!-- MOSI: ESP32 GPIO 11 (1010, 445) -> MicroSD MOSI (420, 845) -->
    <path d="M 1010 445 L 1055 445 L 1055 675 L 565 675 L 565 845 L 420 845" stroke="#22c55e" stroke-width="4"/>

    <!-- SCK: ESP32 GPIO 12 (1010, 490) -> MicroSD SCK (420, 890) -->
    <path d="M 1010 490 L 1070 490 L 1070 695 L 540 695 L 540 890 L 420 890" stroke="#eab308" stroke-width="4"/>

    <!-- MISO: ESP32 GPIO 13 (1010, 535) -> MicroSD MISO (420, 800) -->
    <path d="M 1010 535 L 1060 535 L 1060 635 L 515 635 L 515 800 L 420 800" stroke="#06b6d4" stroke-width="4"/>

    <!-- 7. I2S SES HATLARI (MAX98357A) -->
    <!-- BCLK: ESP32 GPIO 7 (790, 625) -> MAX98357A BCLK (1220, 835) -->
    <path d="M 790 625 L 720 625 L 720 835 L 1220 835" stroke="#3b82f6" stroke-width="4"/>

    <!-- LRC: ESP32 GPIO 8 (790, 670) -> MAX98357A LRC (1220, 880) -->
    <path d="M 790 670 L 740 670 L 740 880 L 1220 880" stroke="#10b981" stroke-width="4"/>

    <!-- DIN: ESP32 GPIO 9 (790, 715) -> MAX98357A DIN (1220, 925) -->
    <path d="M 790 715 L 760 715 L 760 925 L 1220 925" stroke="#f43f5e" stroke-width="4"/>

    <!-- MAX98357A +/- -> SPEAKER -->
    <path d="M 1455 815 L 1545 815" stroke="#ef4444" stroke-width="5"/>
    <path d="M 1455 865 L 1545 865" stroke="#64748b" stroke-width="5"/>
  </g>

  <!-- ==================== 1. LiPo BATTERY ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="145" width="230" height="195" rx="16" fill="url(#batGrad)" stroke="#64748b" stroke-width="2.5"/>
    <rect x="248" y="165" width="16" height="155" rx="4" fill="#d97706" opacity="0.85"/>
    <text x="145" y="195" fill="#0f172a" font-size="18" font-weight="800" text-anchor="middle">LİTYUM POLİMER</text>
    <text x="145" y="222" fill="#1e293b" font-size="22" font-weight="900" text-anchor="middle">603035 / 703048</text>
    <text x="145" y="252" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">3.7V  •  600 - 1200 mAh</text>
    <text x="145" y="278" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">İnce Li-Po Pil</text>
    <text x="145" y="318" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">⏱️ 2 – 4 Saat Kesintisiz Oynatım</text>
    <!-- Terminals -->
    <circle cx="270" cy="220" r="8" fill="#ef4444" stroke="#fff" stroke-width="2"/>
    <text x="242" y="225" fill="#991b1b" font-size="15" font-weight="900" text-anchor="end">+</text>
    <circle cx="270" cy="270" r="8" fill="#475569" stroke="#fff" stroke-width="2"/>
    <text x="242" y="275" fill="#0f172a" font-size="17" font-weight="900" text-anchor="end">−</text>
  </g>

  <!-- ==================== 2. TP4056 + 5V BOOST ADJUSTABLE BOARD ==================== -->
  <g filter="url(#shadow)">
    <rect x="340" y="150" width="270" height="185" rx="12" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Type-C Connector -->
    <rect x="328" y="215" width="22" height="55" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <text x="475" y="180" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">TP4056 + 5V Boost</text>
    <text x="475" y="200" fill="#7dd3fc" font-size="12" font-weight="600" text-anchor="middle">Şarj + Ayarlı Voltaj Yükseltici</text>
    
    <!-- Blue Trimpot Box -->
    <rect x="425" y="215" width="55" height="45" rx="4" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="452" cy="237" r="10" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <line x1="445" y1="237" x2="459" y2="237" stroke="#451a03" stroke-width="2.5"/>
    <text x="452" y="278" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle">Trimpot (5.0V Ayarı)</text>

    <!-- Inductor (Bobin) -->
    <rect x="500" y="215" width="45" height="45" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <text x="522" y="242" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">BOBİN</text>

    <text x="475" y="318" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">⚠️ ESP'ye bağlamadan 5.0V'a ayarlayın!</text>

    <!-- Pads -->
    <circle cx="340" cy="220" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
    <text x="355" y="225" fill="#fff" font-size="13" font-family="Consolas" font-weight="800">BAT+</text>
    <circle cx="340" cy="270" r="7" fill="#64748b" stroke="#fff" stroke-width="2"/>
    <text x="355" y="275" fill="#fff" font-size="13" font-family="Consolas" font-weight="800">BAT-</text>
    <circle cx="610" cy="215" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
    <text x="595" y="220" fill="#fff" font-size="13" font-family="Consolas" font-weight="800" text-anchor="end">VOUT+ (5V)</text>
    <circle cx="610" cy="275" r="7" fill="#94a3b8" stroke="#fff" stroke-width="2"/>
    <text x="595" y="280" fill="#fff" font-size="13" font-family="Consolas" font-weight="800" text-anchor="end">VOUT- (GND)</text>
  </g>

  <!-- ==================== 3. ESP32-S3 MINI (CENTER) ==================== -->
  <g filter="url(#shadow)">
    <rect x="790" y="210" width="220" height="550" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <!-- Type-C Port on top -->
    <rect x="862" y="196" width="76" height="32" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <text x="900" y="217" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">USB-C</text>
    <!-- Ceramic Wi-Fi Antenna -->
    <rect x="806" y="224" width="38" height="26" rx="4" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="825" y="241" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">WiFi</text>
    <!-- ESP32-S3 Chip -->
    <rect x="850" y="320" width="100" height="100" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="900" y="356" fill="#f8fafc" font-size="16" font-weight="900" text-anchor="middle">ESP32-S3</text>
    <text x="900" y="378" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Dual-Core 160MHz</text>
    <text x="900" y="398" fill="#94a3b8" font-size="11" text-anchor="middle">25 FPS MJPEG Engine</text>

    <!-- BOOT button callout -->
    <rect x="862" y="445" width="76" height="34" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="466" fill="#fde047" font-size="12" font-weight="800" text-anchor="middle">BOOT (0)</text>
    <text x="900" y="500" fill="#94a3b8" font-size="11" text-anchor="middle">Tek Tık: Kanal</text>
    <text x="900" y="516" fill="#ec4899" font-size="11" font-weight="700" text-anchor="middle">Çift Tık: MUTE</text>
    <text x="900" y="532" fill="#10b981" font-size="11" text-anchor="middle">Uzun Bas: Ses Seviyesi</text>

    <!-- Status badge -->
    <rect x="840" y="680" width="120" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="900" y="701" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Çift SPI (FSPI+HSPI)</text>

    <!-- LEFT 10 PINS (y = 310, 355, 400, 445, 490, 535, 580, 625, 670, 715) -->
    <g font-family="Consolas" font-size="13" font-weight="800">
      <circle cx="790" cy="310" r="7" fill="#f97316" stroke="#fff" stroke-width="2"/>
      <text x="805" y="315" fill="#fdba74">3V3 (Ekran)</text>

      <circle cx="790" cy="355" r="7" fill="#fde047" stroke="#fff" stroke-width="2"/>
      <text x="805" y="360" fill="#fde047">1 (BLK PWM)</text>

      <circle cx="790" cy="400" r="7" fill="#22c55e" stroke="#fff" stroke-width="2"/>
      <text x="805" y="405" fill="#86efac">2 (RES)</text>

      <circle cx="790" cy="445" r="7" fill="#a855f7" stroke="#fff" stroke-width="2"/>
      <text x="805" y="450" fill="#d8b4fe">3 (DC)</text>

      <circle cx="790" cy="490" r="7" fill="#eab308" stroke="#fff" stroke-width="2"/>
      <text x="805" y="495" fill="#fde047">4 (SCL/CLK)</text>

      <circle cx="790" cy="535" r="7" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <text x="805" y="540" fill="#64748b">5 (boş)</text>

      <circle cx="790" cy="580" r="7" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
      <text x="805" y="585" fill="#93c5fd">6 (SDA/MOSI)</text>

      <circle cx="790" cy="625" r="7" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
      <text x="805" y="630" fill="#93c5fd">7 (I2S BCLK)</text>

      <circle cx="790" cy="670" r="7" fill="#10b981" stroke="#fff" stroke-width="2"/>
      <text x="805" y="675" fill="#6ee7b7">8 (I2S LRC)</text>

      <circle cx="790" cy="715" r="7" fill="#f43f5e" stroke="#fff" stroke-width="2"/>
      <text x="805" y="720" fill="#fda4af">9 (I2S DIN)</text>
    </g>

    <!-- RIGHT 10 PINS -->
    <g font-family="Consolas" font-size="13" font-weight="800" text-anchor="end">
      <circle cx="1010" cy="310" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
      <text x="995" y="315" fill="#fca5a5">5V (5U Güç)</text>

      <circle cx="1010" cy="355" r="7" fill="#94a3b8" stroke="#fff" stroke-width="2"/>
      <text x="995" y="360" fill="#e2e8f0">GND (Toprak)</text>

      <circle cx="1010" cy="400" r="7" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
      <text x="995" y="405" fill="#fcd34d">10 (SD CS)</text>

      <circle cx="1010" cy="445" r="7" fill="#22c55e" stroke="#fff" stroke-width="2"/>
      <text x="995" y="450" fill="#86efac">11 (SD MOSI)</text>

      <circle cx="1010" cy="490" r="7" fill="#eab308" stroke="#fff" stroke-width="2"/>
      <text x="995" y="495" fill="#fde047">12 (SD SCK)</text>

      <circle cx="1010" cy="535" r="7" fill="#06b6d4" stroke="#fff" stroke-width="2"/>
      <text x="995" y="540" fill="#67e8f9">13 (SD MISO)</text>

      <circle cx="1010" cy="580" r="7" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <text x="995" y="585" fill="#64748b">14 (boş)</text>

      <circle cx="1010" cy="625" r="7" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <text x="995" y="630" fill="#64748b">15 (boş)</text>

      <circle cx="1010" cy="670" r="7" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <text x="995" y="675" fill="#64748b">16 (boş)</text>

      <circle cx="1010" cy="715" r="7" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <text x="995" y="720" fill="#64748b">17 (boş)</text>
    </g>
  </g>

  <!-- ==================== 4. 1.3" 240x240 ST7789 IPS DISPLAY ==================== -->
  <g filter="url(#shadow)">
    <rect x="1250" y="155" width="510" height="425" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Rounded IPS Screen Glass -->
    <rect x="1365" y="190" width="365" height="315" rx="28" fill="url(#screenGrad)" stroke="#64748b" stroke-width="3"/>
    <!-- Retro SMPTE Bars Preview inside Screen -->
    <g clip-path="inset(0 round 22px)" opacity="0.88">
      <rect x="1385" y="210" width="46" height="190" fill="#f8fafc"/>
      <rect x="1431" y="210" width="46" height="190" fill="#facc15"/>
      <rect x="1477" y="210" width="46" height="190" fill="#22d3ee"/>
      <rect x="1523" y="210" width="46" height="190" fill="#4ade80"/>
      <rect x="1569" y="210" width="46" height="190" fill="#e879f9"/>
      <rect x="1615" y="210" width="46" height="190" fill="#f87171"/>
      <rect x="1661" y="210" width="49" height="190" fill="#3b82f6"/>
      <rect x="1385" y="400" width="325" height="82" fill="#090c12"/>
      <text x="1548" y="432" fill="#4ade80" font-size="22" font-family="Consolas" font-weight="900" text-anchor="middle">COLLECTIBLE TV</text>
      <text x="1548" y="462" fill="#cbd5e1" font-size="14" font-family="Consolas" text-anchor="middle">1.3" 240×240 IPS • ST7789</text>
    </g>
    <text x="1548" y="545" fill="#f8fafc" font-size="18" font-weight="800" text-anchor="middle">1.3" ST7789 SPI IPS Ekran</text>
    <text x="1548" y="566" fill="#fde047" font-size="13" font-weight="700" text-anchor="middle">(7-Pin Header — Sadece 3.3V Besleme!)</text>

    <!-- 7 Pins on left of screen board -->
    <g font-family="Consolas" font-size="14" font-weight="800">
      <circle cx="1250" cy="215" r="7" fill="#94a3b8" stroke="#fff" stroke-width="2"/>
      <text x="1266" y="220" fill="#e2e8f0">GND</text>

      <circle cx="1250" cy="260" r="7" fill="#f97316" stroke="#fff" stroke-width="2"/>
      <text x="1266" y="265" fill="#fdba74">VCC (3.3V)</text>

      <circle cx="1250" cy="305" r="7" fill="#eab308" stroke="#fff" stroke-width="2"/>
      <text x="1266" y="310" fill="#fde047">SCL (CLK)</text>

      <circle cx="1250" cy="395" r="7" fill="#22c55e" stroke="#fff" stroke-width="2"/>
      <text x="1266" y="400" fill="#86efac">RES (RST)</text>

      <circle cx="1250" cy="440" r="7" fill="#a855f7" stroke="#fff" stroke-width="2"/>
      <text x="1266" y="445" fill="#d8b4fe">DC</text>

      <circle cx="1250" cy="485" r="7" fill="#fde047" stroke="#fff" stroke-width="2"/>
      <text x="1266" y="490" fill="#fef08a">BLK (PWM)</text>
    </g>
  </g>

  <!-- ==================== 5. 16GB MICROSD SPI MODULE ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="670" width="380" height="305" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5"/>
    <!-- Metal SD Card Holder -->
    <rect x="65" y="715" width="185" height="175" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5"/>
    <rect x="52" y="750" width="20" height="105" rx="3" fill="#334155"/>
    <text x="158" y="795" fill="#0f172a" font-size="22" font-weight="900" text-anchor="middle">16GB SD</text>
    <text x="158" y="822" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">FAT32  •  /v/</text>
    <text x="158" y="846" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">.mjpeg + .pcm</text>
    <text x="158" y="920" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">16GB MicroSD Modülü (HSPI)</text>
    <text x="158" y="944" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">Doğrulandı: 15.193 MB Aktif</text>
    <text x="158" y="961" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">VCC = 5V Pinine Bağlanmalıdır</text>

    <!-- 6 Pins on right of SD module -->
    <g font-family="Consolas" font-size="14" font-weight="800" text-anchor="end">
      <circle cx="420" cy="710" r="7" fill="#94a3b8" stroke="#fff" stroke-width="2"/>
      <text x="404" y="715" fill="#e2e8f0">GND</text>

      <circle cx="420" cy="755" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
      <text x="404" y="760" fill="#fca5a5">VCC (5V)</text>

      <circle cx="420" cy="800" r="7" fill="#06b6d4" stroke="#fff" stroke-width="2"/>
      <text x="404" y="805" fill="#67e8f9">MISO</text>
